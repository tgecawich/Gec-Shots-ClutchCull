<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ClutchCull - label jersey crops</title>
<!--
  Step 2 of training the jersey digit classifier. Open this file directly in a
  browser (no server needed), click "Pick crops folder" and select the folder
  that extract_jersey_crops.py produced. For each crop, type the jersey number
  you can read and press Enter, or press one of the skip keys. Progress is
  saved to localStorage as you go, so closing the tab loses nothing. When done
  (or whenever), click "Download labels.csv".

  Keys:
    0-9 then Enter  -> label with the typed number
    N               -> no number visible (back turned, occluded, no jersey)
    U               -> number present but unreadable even to a human
    B               -> not a player (ref, coach, fan) / bad crop
    Backspace       -> clear typed digits; Left arrow -> go back one

  "N" and "B" crops matter: they become negative examples so the model learns
  to say "nothing here" instead of hallucinating a number, which is exactly the
  failure mode the roster constraint papers over today.
-->
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee;
         display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  header { padding: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #444;
           background: #222; color: #eee; cursor: pointer; }
  button:hover { background: #2e2e2e; }
  #stage { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-bottom: 40px; }
  #crop { max-width: 448px; max-height: 70vh; border-radius: 10px; border: 1px solid #333; }
  #typed { font-size: 2.2rem; font-weight: 800; min-height: 2.6rem; letter-spacing: .1em; }
  #meta { color: #999; font-size: .9rem; }
  #help { color: #777; font-size: .85rem; max-width: 520px; text-align: center; line-height: 1.5; }
  .flash { animation: flash .25s; }
  @keyframes flash { from { outline: 3px solid #ff9231; } to { outline: none; } }
</style>
</head>
<body>
<header>
  <button id="pick">Pick crops folder</button>
  <button id="dl">Download labels.csv</button>
  <button id="reset">Reset progress</button>
  <span id="meta">no folder loaded</span>
</header>
<div id="stage">
  <img id="crop" alt="jersey crop">
  <div id="typed">&nbsp;</div>
  <div id="help">
    Type the number, Enter to save. <b>N</b> = no number visible,
    <b>U</b> = unreadable, <b>B</b> = not a player / bad crop,
    <b>&larr;</b> = back, Backspace = clear.
  </div>
</div>
<script>
(() => {
  const KEY = "cc_jersey_labels";
  let files = [];        // [{name, file}]
  let idx = 0;
  let typed = "";
  let labels = JSON.parse(localStorage.getItem(KEY) || "{}"); // name -> label
  let url = null;

  const $ = (id) => document.getElementById(id);

  function save() { localStorage.setItem(KEY, JSON.stringify(labels)); }

  function firstUnlabeled() {
    const i = files.findIndex(f => !(f.name in labels));
    return i === -1 ? files.length - 1 : i;
  }

  function show() {
    if (!files.length) return;
    idx = Math.max(0, Math.min(idx, files.length - 1));
    const f = files[idx];
    if (url) URL.revokeObjectURL(url);
    url = URL.createObjectURL(f.file);
    $("crop").src = url;
    $("crop").classList.remove("flash"); void $("crop").offsetWidth; $("crop").classList.add("flash");
    const done = Object.keys(labels).filter(n => files.some(f2 => f2.name === n)).length;
    const cur = labels[f.name];
    $("meta").textContent = `${idx + 1}/${files.length} - ${f.name}` +
      (cur !== undefined ? ` [labeled: ${cur}]` : "") + ` - ${done} labeled`;
    typed = "";
    $("typed").innerHTML = "&nbsp;";
  }

  function label(value) {
    labels[files[idx].name] = value;
    save();
    idx = idx + 1 < files.length ? idx + 1 : firstUnlabeled();
    show();
  }

  $("pick").onclick = async () => {
    const input = document.createElement("input");
    input.type = "file";
    input.webkitdirectory = true;
    input.onchange = () => {
      files = [...input.files]
        .filter(f => /\.jpe?g$/i.test(f.name))
        .map(f => ({ name: (f.webkitRelativePath || f.name), file: f }))
        .sort((a, b) => a.name.localeCompare(b.name));
      idx = firstUnlabeled();
      show();
    };
    input.click();
  };

  $("dl").onclick = () => {
    const rows = [["filename", "label"]];
    for (const [name, v] of Object.entries(labels)) rows.push([name, v]);
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = "labels.csv";
    a.click();
  };

  $("reset").onclick = () => {
    if (confirm("Clear ALL saved labels?")) { labels = {}; save(); show(); }
  };

  document.addEventListener("keydown", (e) => {
    if (!files.length) return;
    if (e.key >= "0" && e.key <= "9" && typed.length < 2) {
      typed += e.key; $("typed").textContent = typed;
    } else if (e.key === "Enter" && typed) {
      label(typed);
    } else if (e.key === "Backspace") {
      typed = ""; $("typed").innerHTML = "&nbsp;";
    } else if (e.key === "ArrowLeft") {
      idx = Math.max(0, idx - 1); show();
    } else if (e.key === "ArrowRight") {
      idx = Math.min(files.length - 1, idx + 1); show();
    } else if (/^[nN]$/.test(e.key)) { label("none");
    } else if (/^[uU]$/.test(e.key)) { label("unreadable");
    } else if (/^[bB]$/.test(e.key)) { label("bad");
    }
  });
})();
</script>
</body>
</html>
